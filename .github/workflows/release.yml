name: Build and Release

on:
  push:
    branches:
      - 'v_*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: brookfile_linux_x86-64
            binary: output/backend
          - os: windows-latest
            artifact: brookfile_windows_x86-64.exe
            binary: output/backend.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: python build.py

      - name: Rename artifact
        shell: bash
        run: mv ${{ matrix.binary }} output/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag name
        id: tag
        run: echo "tag=${GITHUB_REF_NAME/v_/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
